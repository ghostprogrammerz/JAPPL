name: Apply compiler costume support

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply costume support
        run: python3 .github/scripts/apply-costume-support.py
      - name: Install and test
        run: |
          cd ide
          npm install
          cd ..
          make clean
          make
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.c ide/index.html ide/package.json ide/package-lock.json ide/patch-sb3.js .github/scripts/apply-costume-support.py .github/workflows/apply-costume.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add compiler support for IDE costumes [skip ci]'
          git push origin main
