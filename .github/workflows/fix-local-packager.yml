name: Fix local Packager preview

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'ghostprogrammerz'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rewrite IDE preview integration
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          index = Path('ide/index.html')
          text = index.read_text()

          start = text.index('async function loadProject(blob) {')
          end = text.index('function updateStageSize()', start)
          replacement = r'''async function loadProject(blob) {
            setStatus('loading…', '');
            document.getElementById('stage-label').textContent = 'Loading…';
            document.getElementById('stage-placeholder').style.display = 'none';

            const iframe = document.getElementById('stage-iframe');
            iframe.style.display = 'block';
            const backendUrl = document.getElementById('backend-url').value.trim() || location.origin;

            iframe.onload = () => {
              setStatus('running', 'ok');
              document.getElementById('stage-label').textContent = 'Running';
            };
            iframe.onerror = () => {
              setStatus('preview failed', 'err');
              document.getElementById('stage-label').textContent = 'Preview failed';
            };
            iframe.src = `${backendUrl}/preview?ts=${Date.now()}`;
          }

          function greenFlag() {
            const iframe = document.getElementById('stage-iframe');
            if (!iframe || iframe.style.display === 'none') {
              compileAndRun();
              return;
            }
            iframe.src = iframe.src.split('?')[0] + '?ts=' + Date.now();
          }

          function stopAll() {
            const iframe = document.getElementById('stage-iframe');
            if (!iframe) return;
            iframe.src = 'about:blank';
            iframe.style.display = 'none';
            document.getElementById('stage-placeholder').style.display = 'flex';
            document.getElementById('stage-label').textContent = 'Stopped';
            setStatus('stopped');
          }

          '''
          index.write_text(text[:start] + replacement + text[end:])

          server = Path('server.c')
          text = server.read_text()

          # Remove the fragile server-side JavaScript injection entirely.
          text = re.sub(
              r'/\*\n \* The existing IDE calls.*?\nstatic void handle_static',
              'static void handle_static',
              text,
              count=1,
              flags=re.S,
          )

          # Serve ide/index.html byte-for-byte. No HTML rewriting or JS injection.
          root_start = text.index('    if (!strcmp(url, "/") || !strcmp(url, "/index.html")) {')
          root_end = text.index('    if (!strncmp(url, "/static/", 8)', root_start)
          root_block = '''    if (!strcmp(url, "/") || !strcmp(url, "/index.html")) {
        size_t len = 0;
        char *body = read_file_binary(g_ide_html, &len);
        if (!body) {
            http_respond(fd, 404, "text/plain", "Not Found\\n", 10);
            return;
        }
        http_respond(fd, 200, "text/html; charset=utf-8", body, len);
        free(body);
        return;
    }

'''
          server.write_text(text[:root_start] + root_block + text[root_end:])
          PY

      - name: Commit fixed files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ide/index.html server.c
          git diff --cached --quiet || git commit -m "Fix IDE local TurboWarp Packager preview"
          git push origin main

      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/fix-local-packager.yml
          git commit -m "Remove one-shot Packager repair workflow"
          git push origin main
