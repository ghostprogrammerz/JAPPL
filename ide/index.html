<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAPPL IDE</title>
<style>
  :root {
    --bg:        #1e1e2e;
    --panel:     #252535;
    --surface:   #373759;
    --border:    #3a3a5c;
    --accent:    #ff8c00;
    --accent2:   #4c97ff;
    --text:      #f0f0f8;
    --text-dim:  #9999cc;
    --green:     #59c059;
    --red:       #ff6680;
    --bar:       #171728;
    --sprite-sel:#2e2e50;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    --font-ui:   'Inter', system-ui, sans-serif;
    --radius:    6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 13px; }

  /* ── TOP BAR ── */
  #topbar {
    height: 42px;
    background: var(--bar);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    z-index: 100;
  }
  #topbar .logo {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 15px;
    color: var(--accent);
    letter-spacing: 2px;
    margin-right: 8px;
  }
  #topbar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
  .btn {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: var(--radius);
    border: none; cursor: pointer; font-size: 12px; font-family: var(--font-ui);
    font-weight: 600; transition: all 0.15s; white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #c73652; }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--border); }
  .btn svg { width: 13px; height: 13px; }
  #topbar .spacer { flex: 1; }
  #compile-status {
    font-size: 11px; color: var(--text-dim);
    font-family: var(--font-mono);
  }
  #compile-status.ok  { color: var(--green); }
  #compile-status.err { color: var(--red); }

  /* ── MAIN LAYOUT ── */
  #main {
    display: grid;
    grid-template-columns: 260px 1fr 340px;
    grid-template-rows: 1fr;
    height: calc(100vh - 42px);
    overflow: hidden;
  }

  /* ── LEFT PANEL (docs iframe) ── */
  #left-panel {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #left-panel .panel-header {
    height: 32px;
    background: var(--bar);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  #left-panel .panel-header svg { width: 12px; height: 12px; }
  #docs-url-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
  }
  #docs-url-input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 11px;
    font-family: var(--font-mono);
    padding: 3px 7px;
    outline: none;
  }
  #docs-url-input:focus { border-color: var(--accent); }
  #docs-go { padding: 3px 8px; font-size: 11px; }
  #docs-iframe {
    flex: 1;
    border: none;
    background: #fff;
  }

  /* ── CENTER PANEL (editor) ── */
  #center-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }
  #sprite-tabs-bar {
    display: flex;
    align-items: center;
    background: var(--bar);
    border-bottom: 1px solid var(--border);
    height: 36px;
    padding: 0 6px;
    gap: 2px;
    overflow-x: auto;
    scrollbar-width: none;
    flex-shrink: 0;
  }
  #sprite-tabs-bar::-webkit-scrollbar { display: none; }
  .sprite-tab {
    display: flex; align-items: center; gap: 6px;
    padding: 0 12px; height: 28px; border-radius: 4px;
    font-size: 12px; font-weight: 500; cursor: pointer;
    white-space: nowrap; color: var(--text-dim);
    border: 1px solid transparent;
    transition: all 0.12s;
    user-select: none;
    flex-shrink: 0;
  }
  .sprite-tab:hover { background: var(--panel); color: var(--text); }
  .sprite-tab.active {
    background: var(--sprite-sel);
    color: var(--text);
    border-color: var(--border);
  }
  .sprite-tab .tab-close {
    width: 14px; height: 14px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--text-dim);
    cursor: pointer; margin-left: 2px;
  }
  .sprite-tab .tab-close:hover { background: var(--accent); color: #fff; }
  #add-sprite-tab {
    width: 28px; height: 28px; border-radius: 4px;
    background: none; border: 1px dashed var(--border);
    color: var(--text-dim); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-left: 4px;
    transition: all 0.12s;
  }
  #add-sprite-tab:hover { border-color: var(--accent); color: var(--accent); }

  #editor-wrapper { flex: 1; overflow: hidden; position: relative; }
  #monaco-editor { width: 100%; height: 100%; }

  /* error gutter overlay */
  #error-bar {
    background: #1a0a0a;
    border-top: 1px solid #4a1515;
    color: var(--red);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 12px;
    max-height: 80px;
    overflow-y: auto;
    display: none;
    flex-shrink: 0;
  }
  #error-bar.visible { display: block; }
  #error-bar .err-line { padding: 1px 0; }

  /* ── RIGHT PANEL ── */
  #right-panel {
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
    background: var(--panel);
    overflow: hidden;
  }

  /* Stage */
  #stage-section {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid var(--border);
  }
  #stage-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    background: var(--bar);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .stage-btn {
    width: 28px; height: 28px; border-radius: 4px;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s;
  }
  #btn-green-flag { background: var(--green); }
  #btn-green-flag:hover { background: #388e3c; }
  #btn-stop       { background: var(--red); }
  #btn-stop:hover { background: #c62828; }
  #btn-fullscreen { background: var(--surface); margin-left: auto; }
  #btn-fullscreen:hover { background: var(--border); }
  .stage-btn svg { width: 14px; height: 14px; fill: #fff; }

  #stage-container {
    position: relative;
    background: #000;
    overflow: hidden;
  }
  #tw-iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  #stage-placeholder {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; color: var(--text-dim);
    font-size: 12px;
  }
  #stage-placeholder svg { width: 40px; height: 40px; opacity: 0.3; }
  #stage-placeholder p { opacity: 0.5; }

  /* Sprite list */
  #sprites-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #sprites-header {
    height: 32px;
    background: var(--bar);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px;
    flex-shrink: 0;
  }
  #sprites-header span {
    font-size: 11px; font-weight: 600;
    color: var(--text-dim); letter-spacing: 0.5px; text-transform: uppercase;
  }
  #sprites-header button {
    background: none; border: none; cursor: pointer; color: var(--text-dim);
    font-size: 18px; line-height: 1; padding: 0 2px;
    transition: color 0.12s;
  }
  #sprites-header button:hover { color: var(--accent); }

  #sprites-grid {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 8px;
    padding: 10px;
    overflow-y: auto;
  }
  #sprites-grid::-webkit-scrollbar { width: 4px; }
  #sprites-grid::-webkit-scrollbar-track { background: transparent; }
  #sprites-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .sprite-card {
    width: 70px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 4px; border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    transition: all 0.12s;
    position: relative;
  }
  .sprite-card:hover { border-color: var(--accent2); }
  .sprite-card.active { border-color: var(--accent); background: var(--sprite-sel); }
  .sprite-thumb {
    width: 44px; height: 44px;
    border-radius: 4px;
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    overflow: hidden;
  }
  .sprite-name {
    font-size: 10px; color: var(--text-dim);
    text-align: center; width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 0 2px;
  }
  .sprite-card.active .sprite-name { color: var(--text); }
  .sprite-actions {
    position: absolute; top: 3px; right: 3px;
    display: none; gap: 3px;
  }
  .sprite-card:hover .sprite-actions { display: flex; }
  .sprite-action-btn {
    width: 16px; height: 16px; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: none; padding: 0;
  }
  .sprite-action-btn.rename { background: var(--accent2); }
  .sprite-action-btn.delete { background: var(--accent); }
  .sprite-action-btn svg { width: 9px; height: 9px; fill: #fff; }

  /* Add sprite card */
  .sprite-card.add-card {
    border-style: dashed; background: none;
    color: var(--text-dim); font-size: 22px;
    justify-content: center;
  }
  .sprite-card.add-card:hover { border-color: var(--accent2); color: var(--accent2); }

  /* ── MODALS / OVERLAYS ── */
  #rename-modal {
    display: none;
    position: fixed; inset: 0; z-index: 999;
    background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center;
  }
  #rename-modal.open { display: flex; }
  .modal-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    width: 300px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .modal-box h3 { font-size: 14px; font-weight: 600; }
  .modal-box input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 13px;
    padding: 7px 10px;
    outline: none; width: 100%;
    font-family: var(--font-ui);
  }
  .modal-box input:focus { border-color: var(--accent); }
  .modal-box .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }

  /* ── COSTUME MODAL ── */
  #costume-modal {
    display: none;
    position: fixed; inset: 0; z-index: 999;
    background: rgba(0,0,0,0.65);
    align-items: center; justify-content: center;
  }
  #costume-modal.open { display: flex; }
  .costume-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 420px;
    max-height: 70vh;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .costume-box-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .costume-box-header h3 { font-size: 14px; font-weight: 600; }
  .costume-box-header .close-btn {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 18px; line-height: 1;
    padding: 0 2px;
  }
  .costume-box-header .close-btn:hover { color: var(--accent); }
  #costume-list {
    flex: 1; overflow-y: auto;
    padding: 10px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .costume-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--border);
  }
  .costume-item .costume-preview {
    width: 40px; height: 40px; border-radius: 4px;
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--text-dim);
    overflow: hidden; flex-shrink: 0;
  }
  .costume-item .costume-preview img { width: 100%; height: 100%; object-fit: contain; }
  .costume-item .costume-info { flex: 1; min-width: 0; }
  .costume-item .costume-name {
    font-size: 12px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .costume-item .costume-meta { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
  .costume-item .costume-del {
    width: 22px; height: 22px; border-radius: 4px;
    background: none; border: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.1s;
  }
  .costume-item .costume-del:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .costume-empty {
    text-align: center; color: var(--text-dim); font-size: 12px;
    padding: 20px; opacity: 0.6;
  }
  .costume-footer {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    display: flex; gap: 8px; align-items: center;
    flex-shrink: 0;
  }
  #costume-drop-zone {
    flex: 1; border: 1px dashed var(--border); border-radius: 6px;
    padding: 8px 12px; text-align: center;
    color: var(--text-dim); font-size: 11px;
    cursor: pointer; transition: all 0.15s;
  }
  #costume-drop-zone:hover, #costume-drop-zone.drag-over {
    border-color: var(--accent2); color: var(--accent2);
    background: rgba(15,124,114,0.08);
  }
  #costume-file-input { display: none; }

  /* ── LIST PANEL ── */
  #list-panel {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--bar);
    max-height: 180px;
    overflow-y: auto;
    display: none;
  }
  #list-panel.has-lists { display: block; }
  #list-panel::-webkit-scrollbar { width: 4px; }
  #list-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .list-item {
    border-bottom: 1px solid var(--border);
  }
  .list-header {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px; cursor: pointer;
    font-size: 11px; font-weight: 600;
    color: var(--text-dim); font-family: var(--font-mono);
    user-select: none;
    transition: background 0.1s;
  }
  .list-header:hover { background: var(--panel); }
  .list-header .list-arrow {
    font-size: 9px; transition: transform 0.15s; display: inline-block;
  }
  .list-header.open .list-arrow { transform: rotate(90deg); }
  .list-header .list-count {
    margin-left: auto; font-size: 10px;
    background: var(--surface); border-radius: 10px;
    padding: 1px 6px; color: var(--text-dim);
  }
  .list-body {
    display: none;
    padding: 4px 10px 6px 24px;
    font-family: var(--font-mono); font-size: 11px;
    color: var(--text);
    max-height: 100px; overflow-y: auto;
    background: var(--panel);
  }
  .list-body.open { display: block; }
  .list-body .list-row {
    display: flex; gap: 8px; align-items: baseline;
    padding: 1px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .list-body .list-idx { color: var(--text-dim); min-width: 28px; text-align: right; font-size: 10px; }
  .list-body .list-val { color: var(--text); word-break: break-all; }

  /* scrollbars */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="logo">JAPPL</div>
  <div class="sep"></div>
  <button class="btn btn-primary" id="btn-compile" onclick="compileAndRun()">
    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 2l10 6-10 6V2z"/></svg>
    Compile &amp; Run
  </button>
  <button class="btn btn-secondary" id="btn-compile-only" onclick="compileOnly()">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="4,8 8,12 12,4"/></svg>
    Compile
  </button>
  <button class="btn btn-secondary" onclick="triggerOpenSb3()" title="Load .sb3 and decompile">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 2h6l4 4v9H4V2z"/><polyline points="10,2 10,6 14,6"/><path d="M6 10h4M6 12h2"/></svg>
    Open .sb3
  </button>
  <input type="file" id="open-sb3-input" accept=".sb3" style="display:none" onchange="openSb3File(this)">
  <button class="btn btn-secondary" onclick="downloadSb3()" id="btn-download" style="display:none">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v7M5 8l3 3 3-3M3 13h10"/></svg>
    .sb3
  </button>
  <div class="sep"></div>
  <span id="compile-status">ready</span>
  <div class="spacer"></div>
  <span style="font-size:11px;color:var(--text-dim);font-family:var(--font-mono)">jappl2sb3 backend: </span>
  <input id="backend-url" value="http://localhost:8765" style="
    background:var(--panel);border:1px solid var(--border);border-radius:4px;
    color:var(--text);font-size:11px;font-family:var(--font-mono);
    padding:3px 7px;outline:none;width:180px;
  ">
</div>

<!-- MAIN -->
<div id="main">

  <!-- LEFT: DOCS -->
  <div id="left-panel">
    <div class="panel-header">
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="1" y="1" width="10" height="10" rx="1"/>
        <line x1="3" y1="4" x2="9" y2="4"/>
        <line x1="3" y1="6.5" x2="9" y2="6.5"/>
        <line x1="3" y1="9" x2="7" y2="9"/>
      </svg>
      Docs
    </div>
    <div id="docs-url-bar">
      <input id="docs-url-input" type="text" value="/docs/" placeholder="URL">
      <button class="btn btn-secondary" id="docs-go" onclick="loadDocs()">Go</button>
    </div>
    <iframe id="docs-iframe" src="/docs/" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
  </div>

  <!-- CENTER: EDITOR -->
  <div id="center-panel">
    <div id="sprite-tabs-bar">
      <!-- tabs injected here -->
      <button id="add-sprite-tab" title="Add sprite" onclick="addSprite()">+</button>
    </div>
    <div id="editor-wrapper">
      <div id="monaco-editor"></div>
    </div>
    <div id="error-bar"></div>
    <div id="list-panel"></div>
  </div>

  <!-- RIGHT: STAGE + SPRITES -->
  <div id="right-panel">
    <div id="stage-section">
      <div id="stage-controls">
        <button class="stage-btn" id="btn-green-flag" title="Green Flag" onclick="greenFlag()">
          <svg viewBox="0 0 14 14"><path d="M3 2l8 5-8 5V2z"/></svg>
        </button>
        <button class="stage-btn" id="btn-stop" title="Stop" onclick="stopAll()">
          <svg viewBox="0 0 14 14"><rect x="2" y="2" width="10" height="10" rx="1"/></svg>
        </button>
        <span style="font-size:10px;color:var(--text-dim);margin-left:4px" id="stage-label">No project loaded</span>
        <button class="stage-btn" id="btn-fullscreen" title="Fullscreen" onclick="fullscreen()">
          <svg viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="1.4">
            <polyline points="2,5 2,2 5,2"/><polyline points="9,2 12,2 12,5"/>
            <polyline points="12,9 12,12 9,12"/><polyline points="5,12 2,12 2,9"/>
          </svg>
        </button>
      </div>
      <div id="stage-container" style="height:255px">
        <div id="stage-placeholder">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="4" y="8" width="40" height="32" rx="3"/>
            <path d="M18 22l8 6-8 6V22z"/>
          </svg>
          <p>Compile to see your project</p>
        </div>
        <iframe id="stage-iframe" style="display:none;width:100%;height:100%;border:none;" allow="autoplay" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
    </div>

    <div id="sprites-section">
      <div id="sprites-header">
        <span>Sprites</span>
        <div style="display:flex;gap:6px;align-items:center">
          <button title="Edit costumes for active sprite" onclick="openCostumeModal(activeId)"

            Costumes

        </div>

<!-- MONACO -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.0/min/vs/loader.min.js"></script>
<script>
// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
const EMOJIS = ['🐱','🐶','🦊','🐸','🐼','🦁','🐯','🦋','🐙','🦄'];
const SCRATCH_CAT_SVG = `<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="95" height="100" viewBox="-47.5,-50,95,100">
  <g id="cat-body">
    <ellipse cx="0" cy="10" rx="35" ry="30" fill="#ffab19"/>
    <ellipse cx="-18" cy="-5" rx="8" ry="5" fill="#ffab19" transform="rotate(-30,-18,-5)"/>
    <ellipse cx="18" cy="-5" rx="8" ry="5" fill="#ffab19" transform="rotate(30,18,-5)"/>
    <circle cx="0" cy="-10" r="22" fill="#ffab19"/>
    <ellipse cx="-8" cy="-12" rx="4" ry="6" fill="#333" opacity="0.9"/>
    <ellipse cx="8" cy="-12" rx="4" ry="6" fill="#333" opacity="0.9"/>
    <circle cx="-7" cy="-12" r="2.5" fill="#fff"/>
    <circle cx="9" cy="-12" r="2.5" fill="#fff"/>
    <ellipse cx="0" cy="-4" rx="5" ry="3.5" fill="#ff8c8c"/>
    <path d="M-5,-2 Q0,2 5,-2" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-22" y1="-8" x2="-10" y2="-8" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-22" y1="-5" x2="-10" y2="-6" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="22" y1="-8" x2="10" y2="-8" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="22" y1="-5" x2="10" y2="-6" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
    <ellipse cx="-12" cy="22" rx="6" ry="12" fill="#ffab19"/>
    <ellipse cx="12" cy="22" rx="6" ry="12" fill="#ffab19"/>
    <path d="M15,12 Q35,20 30,40" fill="none" stroke="#ffab19" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>`;

const SCRATCH_CAT_DATA_URL = 'data:image/svg+xml;base64,' + btoa(SCRATCH_CAT_SVG);

let sprites = [
  { id: 1, name: 'Sprite1', emoji: '🐱', code: '    when (green flag)\n    {\n        say (Hello World!) for (2) seconds\n    }\n',
    costumes: [{ name: 'costume1', dataUrl: SCRATCH_CAT_DATA_URL, type: 'image/svg+xml', filename: 'costume1.svg' }] }
];
let activeId = 1;
let nextId = 2;
let editor = null;
let sb3Blob = null;
let renameTargetId = null;
let dirty = false;

// ─────────────────────────────────────────────
// MONACO SETUP
// ─────────────────────────────────────────────
require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.0/min/vs' } });
require(['vs/editor/editor.main'], function() {

  // JAPPL language definition
  monaco.languages.register({ id: 'jappl' });
  monaco.languages.setMonarchTokensProvider('jappl', {
    keywords: ['when','repeat','forever','if','else','var','list','sprite','stage','not','and','or','mod','to','of','by','for','at','with','steps','degrees','seconds','secs','contains','define','custom block'],
    tokenizer: {
      root: [
        [/#.*$/, 'comment'],
        [/"([^"\\]|\\.)*"/, 'string'],
        [/\b(when|repeat|forever|if|else|var|list|sprite|stage|not|and|or|mod|to|of|by|for|at|with|steps|degrees|seconds|secs|contains|define|custom block)\b/, 'keyword'],
        [/\b(green flag|key pressed|backdrop switches|clone starts|broadcast|I receive)\b/, 'keyword.control'],
        [/\b(set variable|change variable|delete all of list|add|replace item|item|length of list|show list|hide list)\b/, 'type.identifier'],
        [/\b(say|think|ask|wait|move|turn|go to|glide|point|set x|set y|change x|change y|if on edge bounce|play sound|stop sound|broadcast and wait|stop all|stop this script|stop other scripts|create clone|delete this clone|show|hide|set size|change size|set effect|change effect|clear effects|next costume|switch costume|next backdrop|switch backdrop|stamp|pen down|pen up|set pen color|change pen size|erase all)\b/, 'support.function'],
        [/\b(exp|log|sqrt|sin|cos|tan|asin|acos|atan|abs|floor|ceiling|round)\b/, 'support.function'],
        [/[0-9]+(\.[0-9]+)?/, 'number'],
        [/[(){}]/, 'delimiter'],
        [/[+\-*\/=<>!]/, 'operator'],
      ]
    }
  });

  monaco.languages.setLanguageConfiguration('jappl', {
    comments: { lineComment: '#' },
    brackets: [['(',')'],['{','}']],
    autoClosingPairs: [
      { open: '(', close: ')' },
      { open: '{', close: '}' },
    ],
  });

  monaco.editor.defineTheme('jappl-dark', {
    base: 'vs-dark',
    inherit: true,
    rules: [
      { token: 'comment',          foreground: '546e7a', fontStyle: 'italic' },
      { token: 'string',           foreground: 'a5d6a7' },
      { token: 'keyword',          foreground: 'e94560', fontStyle: 'bold' },
      { token: 'keyword.control',  foreground: 'ef9a9a' },
      { token: 'type.identifier',  foreground: '80cbc4' },
      { token: 'support.function', foreground: 'ce93d8' },
      { token: 'number',           foreground: 'ffcc80' },
      { token: 'delimiter',        foreground: '78909c' },
      { token: 'operator',         foreground: 'b0bec5' },
    ],
    colors: {
      'editor.background':          '#0d1b2a',
      'editor.foreground':          '#e8eaf6',
      'editor.lineHighlightBackground': '#16213e',
      'editorLineNumber.foreground':    '#374d6a',
      'editorLineNumber.activeForeground': '#7986cb',
      'editor.selectionBackground': '#1e3a5f',
      'editorCursor.foreground':    '#e94560',
      'editorIndentGuide.background1': '#1e2d40',
      'scrollbar.shadow':           '#00000000',
      'scrollbarSlider.background': '#1e3a5f80',
    }
  });

  editor = monaco.editor.create(document.getElementById('monaco-editor'), {
    value: sprites[0].code,
    language: 'jappl',
    theme: 'jappl-dark',
    fontFamily: "'JetBrains Mono', 'Fira Code', monospace",
    fontSize: 13,
    lineHeight: 22,
    minimap: { enabled: false },
    scrollBeyondLastLine: false,
    renderLineHighlight: 'gutter',
    padding: { top: 12 },
    wordWrap: 'off',
    automaticLayout: true,
    tabSize: 4,
    insertSpaces: true,
    bracketPairColorization: { enabled: false },
    guides: { indentation: true },
    renderWhitespace: 'none',
    smoothScrolling: true,
    cursorBlinking: 'smooth',
    cursorSmoothCaretAnimation: 'on',
  });

  let suppressChange = false;
  editor.onDidChangeModelContent(() => {
    if (suppressChange) return;
    const sp = sprites.find(s => s.id === activeId);
    if (sp) sp.code = editor.getValue();
    dirty = true;
    setStatus('ready');
  });

  window._editorSetValue = function(code) {
    suppressChange = true;
    editor.setValue(code);
    suppressChange = false;
  };

  renderTabs();
  renderSpriteGrid();
});

// ─────────────────────────────────────────────
// TABS & SPRITES
// ─────────────────────────────────────────────
function renderTabs() {
  const bar = document.getElementById('sprite-tabs-bar');
  const addBtn = document.getElementById('add-sprite-tab');
  // clear existing tabs
  [...bar.querySelectorAll('.sprite-tab')].forEach(t => t.remove());

  sprites.forEach(sp => {
    const tab = document.createElement('div');
    tab.className = 'sprite-tab' + (sp.id === activeId ? ' active' : '');
    tab.dataset.id = sp.id;
    tab.innerHTML = `<span>${sp.emoji}</span><span>${sp.name}</span><span class="tab-close" data-id="${sp.id}">×</span>`;
    tab.onclick = (e) => {
      if (e.target.classList.contains('tab-close')) return;
      switchSprite(sp.id);
    };
    tab.querySelector('.tab-close').onclick = () => removeSprite(sp.id);
    bar.insertBefore(tab, addBtn);
  });
}

function renderSpriteGrid() {
  const grid = document.getElementById('sprites-grid');
  grid.innerHTML = '';
  sprites.forEach(sp => {
    const card = document.createElement('div');
    card.className = 'sprite-card' + (sp.id === activeId ? ' active' : '');
    const costumeCount = sp.costumes ? sp.costumes.length : 0;
    card.innerHTML = `
      <div class="sprite-thumb">${sp.emoji}</div>
      <div class="sprite-name">${sp.name}</div>
      <div class="sprite-actions">
        <button class="sprite-action-btn rename" title="Rename sprite">
          <svg viewBox="0 0 10 10"><path d="M1 7.5L1 9h1.5l4.3-4.3-1.5-1.5L1 7.5zm7-4.1c.2-.2.2-.4 0-.6L6.7 1.5c-.2-.2-.4-.2-.6 0l-.9.9 1.5 1.5.9-.9z"/></svg>
        </button>
        <button class="sprite-action-btn delete" title="Delete sprite">
          <svg viewBox="0 0 10 10"><path d="M1.5 2.5h7M4 1h2M3 2.5v6h4v-6M4.5 4v3M5.5 4v3"/></svg>
        </button>
      </div>
    `;
    card.onclick = (e) => {
      if (e.target.closest('.sprite-actions')) return;
      switchSprite(sp.id);
    };
    card.querySelector('.sprite-action-btn.rename').onclick = (e) => { e.stopPropagation(); openRenameModal(sp.id); };
    card.querySelector('.sprite-action-btn.delete').onclick = (e) => { e.stopPropagation(); removeSprite(sp.id); };
    grid.appendChild(card);
  });
  // add card
  const add = document.createElement('div');
  add.className = 'sprite-card add-card';
  add.textContent = '+';
  add.title = 'Add sprite';
  add.onclick = addSprite;
  grid.appendChild(add);
}

function saveActive() {
  if (!editor) return;
  const sp = sprites.find(s => s.id === activeId);
  if (sp) sp.code = editor.getValue();
}

function switchSprite(id) {
  saveActive();
  activeId = id;
  const sp = sprites.find(s => s.id === id);
  if (!sp) return;
  if (window._editorSetValue) window._editorSetValue(sp.code);
  else if (editor) editor.setValue(sp.code);
  renderTabs();
  renderSpriteGrid();
}

function addSprite() {
  saveActive();
  const id = nextId++;
  const emoji = EMOJIS[(id - 1) % EMOJIS.length];
  const name = `Sprite${id}`;
  sprites.push({ id, name, emoji, code: `    when (green flag)\n    {\n    }\n` });
  activeId = id;
  if (window._editorSetValue) window._editorSetValue(sprites[sprites.length-1].code);
  else if (editor) editor.setValue(sprites[sprites.length-1].code);
  renderTabs();
  renderSpriteGrid();
}

function removeSprite(id) {
  if (sprites.length === 1) return;
  saveActive();
  sprites = sprites.filter(s => s.id !== id);
  if (activeId === id) {
    activeId = sprites[sprites.length - 1].id;
    const sp = sprites.find(s => s.id === activeId);
    if (window._editorSetValue) window._editorSetValue(sp.code);
    else if (editor) editor.setValue(sp.code);
  }
  renderTabs();
  renderSpriteGrid();
}

// ─────────────────────────────────────────────
// COSTUME MODAL
// ─────────────────────────────────────────────
let costumeTargetId = null;

function openCostumeModal(id) {
  costumeTargetId = id;
  const sp = sprites.find(s => s.id === id);
  if (!sp) return;
  if (!sp.costumes) sp.costumes = [];
  document.getElementById('costume-modal-title').textContent = `Costumes — ${sp.name}`;
  renderCostumeList(sp);
  document.getElementById('costume-modal').classList.add('open');
}

function closeCostumeModal() {
  document.getElementById('costume-modal').classList.remove('open');
  costumeTargetId = null;
}

function renderCostumeList(sp) {
  const list = document.getElementById('costume-list');
  if (!sp.costumes || sp.costumes.length === 0) {
    list.innerHTML = '<div class="costume-empty">No costumes yet.<br>Add images below — first costume becomes the default.</div>';
    return;
  }
  list.innerHTML = '';
  sp.costumes.forEach((c, i) => {
    const item = document.createElement('div');
    item.className = 'costume-item';
    item.innerHTML = `
      <div class="costume-preview">
        <img src="${c.dataUrl}" alt="${c.name}">
      </div>
      <div class="costume-info">
        <div class="costume-name">${c.name}</div>
        <div class="costume-meta">${c.type} · costume ${i + 1}</div>
      </div>
      <button class="costume-del" title="Remove costume" onclick="removeCostume(${i})">×</button>
    `;
    list.appendChild(item);
  });
}

function removeCostume(index) {
  const sp = sprites.find(s => s.id === costumeTargetId);
  if (!sp) return;
  sp.costumes.splice(index, 1);
  renderCostumeList(sp);
}

function handleCostumeFileInput(input) {
  addCostumeFiles(Array.from(input.files));
  input.value = '';
}

function handleCostumeDrop(e) {
  e.preventDefault();
  document.getElementById('costume-drop-zone').classList.remove('drag-over');
  const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
  addCostumeFiles(files);
}

function addCostumeFiles(files) {
  const sp = sprites.find(s => s.id === costumeTargetId);
  if (!sp) return;
  if (!sp.costumes) sp.costumes = [];
  let pending = files.length;
  if (!pending) return;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const costume = {
        name: file.name.replace(/\.[^.]+$/, ''),
        dataUrl: e.target.result,
        type: file.type,
        filename: file.name,
        width: 0,
        height: 0,
      };
      const img = new Image();
      img.onload = () => {
        costume.width = img.naturalWidth || img.width || 0;
        costume.height = img.naturalHeight || img.height || 0;
        sp.costumes.push(costume);
        pending--;
        if (pending === 0) renderCostumeList(sp);
      };
      img.onerror = () => {
        sp.costumes.push(costume);
        pending--;
        if (pending === 0) renderCostumeList(sp);
      };
      img.src = costume.dataUrl;
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('costume-modal').onclick = function(e) {
  if (e.target === this) closeCostumeModal();
};

// drag-over highlight
document.getElementById('costume-drop-zone').addEventListener('dragover', e => {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
});
document.getElementById('costume-drop-zone').addEventListener('dragleave', e => {
  e.currentTarget.classList.remove('drag-over');
});

// ─────────────────────────────────────────────
// RENAME MODAL
// ─────────────────────────────────────────────
function openRenameModal(id) {
  renameTargetId = id;
  const sp = sprites.find(s => s.id === id);
  document.getElementById('rename-input').value = sp.name;
  document.getElementById('rename-modal').classList.add('open');
  setTimeout(() => document.getElementById('rename-input').select(), 50);
}
function closeRenameModal() {
  document.getElementById('rename-modal').classList.remove('open');
  renameTargetId = null;
}
function confirmRename() {
  const val = document.getElementById('rename-input').value.trim();
  if (!val) { document.getElementById('rename-input').focus(); return; }
  const sp = sprites.find(s => s.id === renameTargetId);
  if (sp) sp.name = val;
  closeRenameModal();
  renderTabs();
  renderSpriteGrid();
}
document.getElementById('rename-modal').onclick = function(e) {
  if (e.target === this) closeRenameModal();
};

// ─────────────────────────────────────────────
// OPEN DECOMPILED ZIP
// ─────────────────────────────────────────────
function triggerOpenZip() {
  document.getElementById('open-zip-input').click();
}

function triggerOpenSb3() {
  document.getElementById('open-sb3-input').click();
}

async function openSb3File(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  setStatus('decompiling…', '');

  const buf = await file.arrayBuffer();

  const blob = await new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/decompile');
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
    xhr.setRequestHeader('X-Filename', file.name);
    xhr.responseType = 'blob';
    xhr.onload = () => {
      if (xhr.status === 200) resolve(xhr.response);
      else xhr.response.text().then(t => reject(new Error(t))).catch(() => reject(new Error('status ' + xhr.status)));
    };
    xhr.onerror = () => reject(new Error('network error'));
    xhr.send(buf);
  });

  await loadZipBlob(blob);
  setStatus('decompiled ✓', 'ok');
}

async function openZipFile(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  setStatus('opening…', '');
  await loadZipBlob(file);
  setStatus('opened ✓', 'ok');
}

async function loadZipBlob(blob) {
  try {
    JSZip = (await import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js')).default
             || window.JSZip;
  } catch(_) {
    JSZip = window.JSZip;
  }
  if (!JSZip) {
    // fallback: load via script tag
    await new Promise((res, rej) => {
      if (window.JSZip) return res();
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
    JSZip = window.JSZip;
  }

  const buf = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);

  // read project.jappl
  const japplFile = zip.file('project.jappl');
  if (!japplFile) { setStatus('not a JAPPL zip', 'err'); return; }
  const src = await japplFile.async('string');

  // read costumes manifest
  let costumeManifest = [];
  const cmFile = zip.file('costumes.json');
  if (cmFile) {
    try { costumeManifest = JSON.parse(await cmFile.async('string')); } catch(_) {}
  }

  // parse sprites from source: sprite (Name) { ... }
  const newSprites = [];
  let nextNewId = 1;
  const spriteRe = /sprite\s*\(([^)]+)\)\s*\{([\s\S]*?)^\}/gm;
  let m;
  while ((m = spriteRe.exec(src)) !== null) {
    const name = m[1].trim();
    const code = m[2];
    newSprites.push({
      id: nextNewId++,
      name,
      emoji: EMOJIS[(nextNewId - 2) % EMOJIS.length],
      code,
      costumes: [],
      lists: {},
    });
  }
  // if no sprite blocks found, treat whole file as Sprite1
  if (newSprites.length === 0) {
    newSprites.push({ id: nextNewId++, name: 'Sprite1', emoji: EMOJIS[0], code: src, costumes: [], lists: {} });
  }

  // load costume assets for each sprite
  const costumeBySprite = new Map(costumeManifest.map(e => [String(e.sprite), e.costumes || []]));
  for (const sp of newSprites) {
    const meta = costumeBySprite.get(sp.name) || [];
    for (const c of meta) {
      const assetFile = zip.file(c.md5ext);
      if (!assetFile) continue;
      const abuf = await assetFile.async('arraybuffer');
      const ext = (c.dataFormat || 'png').toLowerCase();
      const mime = ext === 'svg' ? 'image/svg+xml'
                 : ext === 'jpg' || ext === 'jpeg' ? 'image/jpeg'
                 : ext === 'gif' ? 'image/gif'
                 : 'image/png';
      const b64 = btoa(String.fromCharCode(...new Uint8Array(abuf)));
      sp.costumes.push({
        name: c.name || c.md5ext,
        dataUrl: `data:${mime};base64,${b64}`,
        type: mime,
        filename: c.md5ext,
        width: c.rotationCenterX ? c.rotationCenterX * 2 : 0,
        height: c.rotationCenterY ? c.rotationCenterY * 2 : 0,
      });
    }
  }

  // read list .txt files — map name → items[]
  // list files are named <listname>.txt
  const listData = {};
  for (const fname of Object.keys(zip.files)) {
    if (!fname.endsWith('.txt')) continue;
    const lname = fname.slice(0, -4);
    const content = await zip.files[fname].async('string');
    listData[lname] = content.split('\n').filter((l, i, arr) => !(i === arr.length - 1 && l === ''));
  }
  // attach lists to sprites (global lists go to all, but we just track them separately)
  globalLists = listData;

  // apply to IDE state
  sprites = newSprites;
  activeId = sprites[0].id;
  nextId = nextNewId;

  if (window._editorSetValue) window._editorSetValue(sprites[0].code);
  else if (editor) editor.setValue(sprites[0].code);

  renderTabs();
  renderSpriteGrid();
  renderListPanel();
}

// ─────────────────────────────────────────────
// LIST PANEL
// ─────────────────────────────────────────────
let globalLists = {};

function renderListPanel() {
  const panel = document.getElementById('list-panel');
  const entries = Object.entries(globalLists);
  if (entries.length === 0) {
    panel.classList.remove('has-lists');
    panel.innerHTML = '';
    return;
  }
  panel.classList.add('has-lists');
  panel.innerHTML = entries.map(([name, items]) => `
    <div class="list-item">
      <div class="list-header" onclick="toggleList(this)">
        <span class="list-arrow">▶</span>
        <span style="color:var(--accent2)">${escHtml(name)}</span>
        <span class="list-count">${items.length} items</span>
      </div>
      <div class="list-body">
        ${items.length === 0
          ? '<span style="color:var(--text-dim);font-size:10px">empty</span>'
          : items.map((v, i) => `<div class="list-row"><span class="list-idx">${i+1}</span><span class="list-val">${escHtml(v)}</span></div>`).join('')
        }
      </div>
    </div>
  `).join('');
}

function toggleList(header) {
  header.classList.toggle('open');
  header.nextElementSibling.classList.toggle('open');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─────────────────────────────────────────────
function loadDocs() {
  const url = document.getElementById('docs-url-input').value.trim();
  if (url) document.getElementById('docs-iframe').src = url;
}
document.getElementById('docs-url-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') loadDocs();
});

// ─────────────────────────────────────────────
// COMPILE
// ─────────────────────────────────────────────
function buildJapplSource() {
  saveActive();

  // build global vars/lists from first sprite or a dedicated stage block
  // For now: wrap each sprite's code in sprite (Name) { ... }
  return sprites.map(sp => {
    return `sprite (${sp.name})\n{\n${sp.code}\n}`;
  }).join('\n\n');
}

function setStatus(msg, cls='') {
  const el = document.getElementById('compile-status');
  el.textContent = msg;
  el.className = cls;
}

function showErrors(errors) {
  const bar = document.getElementById('error-bar');
  if (!errors || errors.length === 0) {
    bar.classList.remove('visible');
    bar.innerHTML = '';
    return;
  }
  bar.classList.add('visible');
  bar.innerHTML = errors.map(e => `<div class="err-line">⚠ ${e}</div>`).join('');
}

async function compileOnly() {
  setStatus('compiling…', '');
  showErrors([]);
  const src = buildJapplSource();
  const backendUrl = document.getElementById('backend-url').value.trim();

  /* Costume files are IDE assets rather than JAPPL source. Send their data
     to the compiler in an optional metadata section. */
  const costumeMeta = sprites.map(sp => ({
    sprite: sp.name,
    costumes: (sp.costumes || []).map(c => ({
      name: c.name,
      dataUrl: c.dataUrl,
      type: c.type || '',
      filename: c.filename || '',
      width: c.width || 0,
      height: c.height || 0
    }))
  })).filter(x => x.costumes.length);
  const requestBody = costumeMeta.length
    ? src + '\n--JAPPL-COSTUMES--\n' + JSON.stringify(costumeMeta)
    : src;

  try {
    const res = await fetch(`${backendUrl}/compile`, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain; charset=utf-8' },
      body: requestBody,
    });

    if (!res.ok) {
      const text = await res.text();
      const errs = text.split('\n').filter(Boolean);
      showErrors(errs);
      setStatus(`${errs.length} error(s)`, 'err');
      sb3Blob = null;
      document.getElementById('btn-download').style.display = 'none';
      return null;
    }

    const blob = await res.blob();
    sb3Blob = blob;
    dirty = false;
    setStatus('compiled ✓', 'ok');
    document.getElementById('btn-download').style.display = '';
    return blob;
  } catch(e) {
    setStatus('backend unreachable', 'err');
    showErrors([`Cannot connect to ${backendUrl}`, 'Is the jappl2sb3 server running?']);
    return null;
  }
}

async function compileAndRun() {
  const blob = await compileOnly();
  if (!blob) return;
  loadProject(blob);
}

async function loadProject(blob) {
  setStatus('loading…', '');
  document.getElementById('stage-label').textContent = 'Loading…';
  document.getElementById('stage-placeholder').style.display = 'none';

  const iframe = document.getElementById('stage-iframe');
  iframe.style.display = 'block';

  // Convert blob to base64 data URI and pass to TurboWarp via URL
  const buf = await blob.arrayBuffer();
  const bytes = new Uint8Array(buf);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  const b64 = btoa(binary);

  // Store on window so the iframe's onload can access it
  window._pendingSb3 = b64;

  iframe.src = 'https://turbowarp.org/editor?noControls';
  iframe.onload = () => {
    // TurboWarp accepts a project via postMessage with {type:'SET_PROJECT', project:<ArrayBuffer>}
    iframe.contentWindow.postMessage({
      type: 'SET_PROJECT',
      project: buf
    }, 'https://turbowarp.org');
    setStatus('running', 'ok');
    document.getElementById('stage-label').textContent = 'Running';
  };
}

function greenFlag() {
  const iframe = document.getElementById('stage-iframe');
  if (iframe.style.display === 'none') { compileAndRun(); return; }
  iframe.contentWindow.postMessage({ type: 'GREEN_FLAG' }, 'https://turbowarp.org');
}

function stopAll() {
  const iframe = document.getElementById('stage-iframe');
  if (iframe.style.display === 'none') return;
  iframe.contentWindow.postMessage({ type: 'STOP_ALL' }, 'https://turbowarp.org');
  document.getElementById('stage-label').textContent = 'Stopped';
}

function updateStageSize() {
  const panel = document.getElementById('right-panel');
  const w = panel.offsetWidth;
  const h = Math.round(w * 0.75);
  document.getElementById('stage-container').style.height = Math.min(h, 280) + 'px';
}

function downloadSb3() {
  if (!sb3Blob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(sb3Blob);
  a.download = 'project.sb3';
  a.click();
}

function fullscreen() {
  const iframe = document.getElementById('stage-iframe');
  if (iframe && iframe.requestFullscreen) iframe.requestFullscreen();
}
window.addEventListener('resize', updateStageSize);
updateStageSize();

// keyboard shortcuts
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault(); compileAndRun();
  }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'Enter') {
    e.preventDefault(); compileOnly();
  }
});
</script>
